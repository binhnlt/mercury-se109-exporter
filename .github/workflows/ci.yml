name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r exporter/requirements.txt
          pip install pytest ruff

      - name: Ruff (lint)
        run: ruff check exporter

      - name: Pytest
        run: pytest -q exporter

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mercury-exporter:ci ./exporter

      - name: Smoke test (exporter imports & serves)
        run: |
          # Point at a closed local port so the switch fetch fails fast.
          docker run -d --name ci -p 9109:9109 \
            -e SWITCH_HOST=127.0.0.1 -e SWITCH_USER=x -e SWITCH_PASS=y \
            -e SCRAPE_TIMEOUT=2 mercury-exporter:ci
          sleep 4
          # /metrics must respond (up=0) even when the switch is unreachable
          curl -sf --max-time 8 http://localhost:9109/metrics | grep -q '^mercury_switch_up'
          docker rm -f ci
